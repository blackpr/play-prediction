name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:


  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx drizzle-kit migrate

  deploy-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: migrate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend Context
        run: |
          # Enable dotglob to match hidden files
          shopt -s dotglob
          # Move all backend files to root
          mv backend/* .
          # Remove other directories to keep context clean
          rm -rf frontend docs

      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.STAGING_BACKEND_APP_NAME }}
          token: ${{ secrets.STAGING_BACKEND_APP_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: migrate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend Context
        run: |
          # Enable dotglob to match hidden files
          shopt -s dotglob
          # Move all frontend files to root
          mv frontend/* .
          # Remove other directories to keep context clean
          rm -rf backend docs

      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.STAGING_FRONTEND_APP_NAME }}
          token: ${{ secrets.STAGING_FRONTEND_APP_TOKEN }}

  notify:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ] && [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "✅ Staging deployment successful!"
          else
            echo "❌ Staging deployment failed!"
            exit 1
          fi
